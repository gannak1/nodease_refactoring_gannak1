services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: moduly-dev-postgres
    environment:
      POSTGRES_DB: moduly_local
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d moduly_local"]
      interval: 60s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: moduly-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  connector-test-redis:
    profiles: ["connector-demo"]
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  connector-test-tls-init:
    profiles: ["connector-demo"]
    build:
      context: ..
      dockerfile: docker/connector-test-postgres/Dockerfile
    entrypoint: ["/usr/local/bin/generate-connector-test-certificates"]
    user: "0:0"
    restart: "no"
    volumes:
      - connector_test_ca_private:/tls/ca-private
      - connector_test_server_tls:/tls/server
      - ../local/connector-test-tls/dev:/tls/public

  connector-test-postgres:
    profiles: ["connector-demo"]
    build:
      context: ..
      dockerfile: docker/connector-test-postgres/Dockerfile
    environment:
      POSTGRES_DB: connector_demo
      POSTGRES_USER: connector_demo_user
      POSTGRES_PASSWORD_FILE: /tls/server/demo-password
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server/server.crt
      - -c
      - ssl_key_file=/tls/server/server.key
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - connector_test_demo_data:/var/lib/postgresql/data
      - connector_test_server_tls:/tls/server:ro
    depends_on:
      connector-test-tls-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connector_demo_user -d connector_demo"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: moduly-dev-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  # Code Execution Sandbox (NSJail-based)
  sandbox:
    build:
      context: ..
      dockerfile: docker/sandbox/Dockerfile
    container_name: moduly-dev-sandbox
    privileged: true # NSJail에 필요 (Namespace 사용)
    environment:
      TZ: Asia/Seoul
      SANDBOX_MIN_WORKERS: 2
      SANDBOX_MAX_WORKERS: 8
      SANDBOX_DEFAULT_TIMEOUT: 10
      SANDBOX_FORCE_FIFO: ${SANDBOX_FORCE_FIFO:-false}
    ports:
      - "8194:8194"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8194/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  connector_test_ca_private:
  connector_test_server_tls:
  connector_test_demo_data:
