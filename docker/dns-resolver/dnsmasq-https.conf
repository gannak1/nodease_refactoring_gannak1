# Resolve Docker service names through the embedded resolver and public names
# through its upstream servers. This container alone has an egress-capable
# network; clients reach it only over their internal proxy-client network.
no-resolv
server=127.0.0.11
listen-address=0.0.0.0
bind-interfaces
no-hosts
domain-needed
bogus-priv
cache-size=1000
address=/proxy/172.30.250.2