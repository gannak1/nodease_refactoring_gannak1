    <text x="42" y="92" class="muted">자동 PR 리뷰 워크플로우 · 실제 실행 로그 기반</text>
    <rect x="720" y="34" width="228" height="46" rx="23" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="758" y="64" fill="#047857" font-family="Inter,Pretendard,Arial,sans-serif" font-size="18" font-weight="900">예상 절감 62%</text>
    <line x1="0" y1="118" x2="1000" y2="118" class="line"/>

    <g transform="translate(42 150)">
      <rect width="280" height="130" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="24" y="38" class="muted">현재 월 예상 비용</text>
      <text x="24" y="82" fill="#c2410c" font-family="Inter,Pretendard,Arial,sans-serif" font-size="34" font-weight="900">$896</text>
      <rect x="24" y="100" width="220" height="10" rx="5" class="barBg"/>
      <rect x="24" y="100" width="200" height="10" rx="5" class="barNow"/>
    </g>

    <g transform="translate(360 150)">
      <rect width="280" height="130" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="24" y="38" class="muted">최적화 후 예상 비용</text>
      <text x="24" y="82" fill="#047857" font-family="Inter,Pretendard,Arial,sans-serif" font-size="34" font-weight="900">$341</text>
      <rect x="24" y="100" width="220" height="10" rx="5" class="barBg"/>
      <rect x="24" y="100" width="76" height="10" rx="5" class="barNext"/>
    </g>

    <g transform="translate(678 150)">
      <rect width="280" height="130" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="24" y="38" class="muted">월 예상 절감액</text>
      <text x="24" y="82" fill="#1d4ed8" font-family="Inter,Pretendard,Arial,sans-serif" font-size="34" font-weight="900">$555</text>
      <text x="24" y="110" fill="#2563eb" font-family="Inter,Pretendard,Arial,sans-serif" font-size="16" font-weight="800">응답 시간 18% 개선 예상</text>
    </g>

    <g transform="translate(42 314)">
      <text x="0" y="0" class="h2">적용 방식</text>
      <rect x="0" y="24" width="916" height="74" rx="14" fill="#f8fafc" stroke="#d9e2ee"/>
      <circle cx="34" cy="61" r="10" fill="#2563eb"/>
      <circle cx="34" cy="61" r="4" fill="#fff"/>
      <text x="58" y="53" class="text">조건부 모델 라우팅을 자동 적용</text>
      <text x="58" y="80" class="muted">문서·단순 UI PR은 저비용 모델, 권한·보안·DB 변경은 기존 고성능 모델 유지</text>
      <rect x="716" y="39" width="168" height="42" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
      <text x="754" y="66" class="chipText">품질 보호</text>
    </g>

    <g transform="translate(42 438)">
      <rect width="186" height="48" rx="10" class="ghost"/>
      <text x="42" y="31" class="ghostText">상세 근거 보기</text>
      <rect x="706" width="252" height="48" rx="10" class="button"/>
      <text x="760" y="31" class="buttonText">최적화 적용</text>
    </g>
  </g>
</svg>
