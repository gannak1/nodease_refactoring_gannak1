<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="cardShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#d6e0ed"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .ui { font-family: Inter, Pretendard, Arial, sans-serif; }
      .top-label { fill:#64748b; font-size:17px; font-weight:700; }
      .nav { fill:#334155; font-size:18px; font-weight:800; }
      .tab { fill:#64748b; font-size:17px; font-weight:800; }
      .tab-active { fill:#0f172a; font-size:17px; font-weight:900; }
      .search { fill:#94a3b8; font-size:16px; font-weight:600; }
      .side-item { fill:#1e293b; font-size:18px; font-weight:900; }
      .node-kicker { fill:#94a3b8; font-size:10px; font-weight:900; letter-spacing:1.3px; }
      .node-title { fill:#172033; font-size:17px; font-weight:900; }
      .node-sub { fill:#64748b; font-size:11px; font-weight:700; }
      .node-meta { fill:#64748b; font-size:10px; font-weight:800; }
      .branch { fill:#334155; font-size:13px; font-weight:900; }
      .branch-sub { fill:#64748b; font-size:10px; font-weight:700; }
      .hint { fill:#475569; font-size:15px; font-weight:800; }
      .metric { fill:#b45309; font-size:10px; font-weight:900; }
      .button { fill:#ffffff; font-size:15px; font-weight:800; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect x="0" y="0" width="1920" height="74" fill="#ffffff" stroke="#e2e8f0"/>
  <g class="ui">
    <text x="54" y="46" class="top-label">내 모듈</text>
    <path d="M138 34 h9 l-5 6 5 6 h-9" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="165" y="46" class="nav">AI 업무 메일 비서</text>
    <rect x="1325" y="17" width="102" height="40" rx="10" fill="#ffffff" stroke="#dbe3ef"/>
    <text x="1350" y="43" class="top-label">설정</text>
    <rect x="1440" y="17" width="102" height="40" rx="10" fill="#ffffff" stroke="#dbe3ef"/>
    <text x="1461" y="43" class="top-label">보고</text>
    <rect x="1555" y="17" width="154" height="40" rx="10" fill="#ffffff" stroke="#dbe3ef"/>
    <text x="1582" y="43" class="top-label">게시하기</text>
    <rect x="1723" y="14" width="140" height="46" rx="11" fill="#10b981"/>
    <path d="M1751 29 l14 8 -14 8z" fill="#ffffff"/>
    <text x="1775" y="43" class="button">테스트 실행</text>
  </g>

  <rect x="24" y="96" width="290" height="960" rx="15" fill="#ffffff" stroke="#dbe3ef"/>
  <g class="ui">
    <text x="84" y="145" class="tab-active">노드</text>
    <text x="168" y="145" class="tab">도구</text>
    <text x="242" y="145" class="tab">시작</text>
    <rect x="46" y="163" width="85" height="3" rx="1.5" fill="#172033"/>
    <rect x="46" y="188" width="246" height="46" rx="9" fill="#f8fafc" stroke="#dbe3ef"/>
    <circle cx="68" cy="211" r="7" fill="none" stroke="#94a3b8" stroke-width="2.2"/>
    <path d="M73 216 l6 6" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round"/>
    <text x="91" y="216" class="search">검색 노드</text>

    <g transform="translate(46 264)">
      <rect width="42" height="42" rx="10" fill="#8b3cf0"/>
      <path d="M12 22 h18 M16 15 h10 M16 29 h10" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="57" y="27" class="side-item">LLM</text>
    </g>
    <g transform="translate(46 328)">
      <rect width="42" height="42" rx="10" fill="#ff6b0b"/>
      <path d="M14 13 v16 M14 21 h14 M28 13 v16" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="57" y="27" class="side-item">IF/ELSE</text>
    </g>
    <g transform="translate(46 392)">
      <rect width="42" height="42" rx="10" fill="#0891b2"/>
      <path d="M13 13 h16 v16 h-16z M17 17 h8 M17 22 h8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <text x="57" y="27" class="side-item">변수 추출</text>
    </g>
    <g transform="translate(46 456)">
      <rect width="42" height="42" rx="10" fill="#4f46e5"/>
      <path d="M14 13 h14 v16 h-14z M17 18 h8 M17 23 h6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <text x="57" y="27" class="side-item">문서 추출</text>
    </g>
    <g transform="translate(46 520)">
      <rect width="42" height="42" rx="10" fill="#10b981"/>
      <path d="M13 14 h16 v14 h-16z M17 28 l-3 5 6-3 6 3-3-5" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="57" y="27" class="side-item">응답</text>
    </g>
    <g transform="translate(46 584)">
      <rect width="42" height="42" rx="10" fill="#e11d70"/>
      <path d="M13 16 h16 M13 22 h16 M13 28 h10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <text x="57" y="27" class="side-item">템플릿</text>
    </g>
  </g>

  <rect x="336" y="96" width="1560" height="960" rx="15" fill="url(#grid)" stroke="#dbe3ef"/>
  <g class="ui">
    <rect x="372" y="124" width="426" height="47" rx="12" fill="#fffdf2" stroke="#fde68a"/>
    <circle cx="397" cy="148" r="8" fill="#f59e0b"/>
    <text x="416" y="153" class="hint">테스트 실행은 로그인한 발표자 권한으로 안전하게 수행됩니다.</text>
  </g>

  <!-- connector paths -->
  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M596 469 H650"/>
    <path d="M844 469 H898"/>
    <path d="M1092 469 H1146"/>
    <path d="M1340 469 H1392"/>
    <path d="M1586 456 C1614 456 1614 330 1640 330"/>
    <path d="M1586 469 H1640"/>
    <path d="M1586 482 C1614 482 1614 608 1640 608"/>
  </g>

  <!-- schedule -->
  <g transform="translate(388 408)" filter="url(#cardShadow)">
    <rect width="208" height="122" rx="11" fill="#fff" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="14" y="17" width="37" height="37" rx="10" fill="#8b5cf6"/>
    <circle cx="32.5" cy="35.5" r="10" fill="none" stroke="#fff" stroke-width="2.4"/>
    <path d="M32.5 29 v7 l5 3" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/>
    <text x="62" y="30" class="node-kicker">TRIGGER</text>
    <text x="62" y="49" class="node-title">스케줄 트리거</text>
    <text x="16" y="78" class="node-sub">새 메일을 주기적으로 확인합니다.</text>
    <rect x="16" y="91" width="88" height="18" rx="9" fill="#f5f3ff"/>
    <text x="27" y="104" class="node-meta">15분마다 실행</text>
  </g>

  <!-- mail -->
  <g transform="translate(650 408)" filter="url(#cardShadow)">
    <rect width="194" height="122" rx="11" fill="#fff" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="14" y="17" width="37" height="37" rx="10" fill="#f05245"/>
    <path d="M20 28 h25 v17 h-25z M20 29 l12.5 10 L45 29" fill="none" stroke="#fff" stroke-width="2.3" stroke-linejoin="round"/>
    <text x="62" y="30" class="node-kicker">MAIL</text>
    <text x="62" y="49" class="node-title">메일 검색</text>
    <text x="16" y="78" class="node-sub">Gmail 읽지 않은 메일 1건</text>
    <rect x="16" y="91" width="80" height="18" rx="9" fill="#fef2f2"/>
    <text x="27" y="104" class="node-meta">IMAP · UNSEEN</text>
  </g>

  <!-- llm -->
  <g transform="translate(898 408)" filter="url(#cardShadow)">
    <rect width="194" height="122" rx="11" fill="#fff" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="14" y="17" width="37" height="37" rx="10" fill="#8b3cf0"/>
    <path d="M22 30 h21 v15 h-21z M27 30 v-4 h11 v4 M29 35 h7 M29 40 h7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="30" class="node-kicker">LLM + KNOWLEDGE</text>
    <text x="62" y="49" class="node-title">정책 기반 분류</text>
    <text x="16" y="78" class="node-sub">등급 · 요약 · 이유 · 답변 초안</text>
    <rect x="16" y="91" width="151" height="18" rx="5" fill="#fef3c7"/>
    <text x="24" y="104" class="metric">메일 대응 정책 KB · JSON 출력</text>
  </g>

  <!-- extraction -->
  <g transform="translate(1146 408)" filter="url(#cardShadow)">
    <rect width="194" height="122" rx="11" fill="#fff" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="14" y="17" width="37" height="37" rx="10" fill="#0891b2"/>
    <path d="M22 26 h21 v21 h-21z M27 31 h11 M27 36 h11 M27 41 h7" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>
    <text x="62" y="30" class="node-kicker">JSON PARSE</text>
    <text x="62" y="49" class="node-title">변수 추출</text>
    <text x="16" y="78" class="node-sub">grade, summary, reason, draft</text>
    <rect x="16" y="91" width="106" height="18" rx="9" fill="#ecfeff"/>
    <text x="27" y="104" class="node-meta">구조화 결과</text>
  </g>

  <!-- condition -->
  <g transform="translate(1392 402)" filter="url(#cardShadow)">
    <rect width="194" height="134" rx="11" fill="#fff" stroke="#fdba74" stroke-width="2"/>
    <rect x="14" y="17" width="37" height="37" rx="10" fill="#ff6b0b"/>
    <path d="M24 28 v17 M24 36 h18 M42 28 v17 M33 36 v-8 M33 36 v8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="62" y="30" class="node-kicker">CONDITION</text>
    <text x="62" y="49" class="node-title">등급별 분기</text>
    <text x="16" y="77" class="node-sub">grade 값으로 경로를 고정 선택</text>
    <rect x="16" y="93" width="48" height="22" rx="11" fill="#dcfce7"/><text x="28" y="108" class="branch">1등급</text>
    <rect x="70" y="93" width="48" height="22" rx="11" fill="#fef3c7"/><text x="82" y="108" class="branch">2등급</text>
    <rect x="124" y="93" width="48" height="22" rx="11" fill="#fee2e2"/><text x="136" y="108" class="branch">3등급</text>
  </g>

  <!-- branch labels -->
  <g class="ui">
    <rect x="1597" y="286" width="55" height="25" rx="12" fill="#dcfce7"/><text x="1611" y="303" class="branch">1등급</text>
    <rect x="1597" y="444" width="55" height="25" rx="12" fill="#fef3c7"/><text x="1611" y="461" class="branch">2등급</text>
    <rect x="1597" y="602" width="55" height="25" rx="12" fill="#fee2e2"/><text x="1611" y="619" class="branch">3등급</text>
  </g>

  <!-- slack cards -->
  <g transform="translate(1640 256)" filter="url(#cardShadow)">
    <rect width="210" height="105" rx="11" fill="#fff" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="14" y="17" width="35" height="35" rx="9" fill="#4a154b"/>
    <path d="M25 25 l3 5 -5 3 M37 25 l-3 5 5 3 M25 42 l3-5 -5-3 M37 42 l-3-5 5-3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="30" class="node-kicker">SLACK</text>
    <text x="60" y="49" class="node-title">일반 알림</text>
    <text x="16" y="77" class="node-sub">요약과 답변 초안 전달</text>
    <text x="16" y="94" class="branch-sub">담당자 검토 · 고객 발송 없음</text>
  </g>
  <g transform="translate(1640 414)" filter="url(#cardShadow)">
    <rect width="210" height="105" rx="11" fill="#fff" stroke="#fcd34d" stroke-width="2"/>
    <rect x="14" y="17" width="35" height="35" rx="9" fill="#4a154b"/>
    <path d="M25 25 l3 5 -5 3 M37 25 l-3 5 5 3 M25 42 l3-5 -5-3 M37 42 l-3-5 5-3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="30" class="node-kicker">SLACK</text>
    <text x="60" y="49" class="node-title">검토 필요</text>
    <text x="16" y="77" class="node-sub">판단 요청과 답변 초안 전달</text>
    <text x="16" y="94" class="branch-sub">환불 · 예외 · 불만</text>
  </g>
  <g transform="translate(1640 572)" filter="url(#cardShadow)">
    <rect width="210" height="105" rx="11" fill="#fff" stroke="#fca5a5" stroke-width="2"/>
    <rect x="14" y="17" width="35" height="35" rx="9" fill="#4a154b"/>
    <path d="M25 25 l3 5 -5 3 M37 25 l-3 5 5 3 M25 42 l3-5 -5-3 M37 42 l-3-5 5-3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="30" class="node-kicker">SLACK</text>
    <text x="60" y="49" class="node-title">🚨 긴급 알림</text>
    <text x="16" y="77" class="node-sub">즉시 확인 요청과 답변 초안</text>
    <text x="16" y="94" class="branch-sub">장애 · 보안 · 개인정보</text>
  </g>

  <!-- canvas helper -->
  <g class="ui" transform="translate(1056 970)">
    <rect width="402" height="56" rx="12" fill="#fff" stroke="#dbe3ef" filter="url(#cardShadow)"/>
    <text x="28" y="35" class="top-label">⌁</text><line x1="62" y1="12" x2="62" y2="44" stroke="#e2e8f0"/>
    <text x="84" y="35" class="top-label">50%</text><text x="138" y="35" class="top-label">⌄</text>
    <line x1="170" y1="12" x2="170" y2="44" stroke="#e2e8f0"/>
    <text x="194" y="35" class="top-label">▦  Move 10px</text>
    <line x1="326" y1="12" x2="326" y2="44" stroke="#e2e8f0"/>
    <text x="350" y="35" class="top-label">⛶</text>
  </g>
</svg>
