apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: dev
  labels:
    app: worker
    env: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        env: dev
      annotations:
        nodease.io/schedule-dispatch-fingerprint: "v1|disabled|5|50|10|50|100|60|120|900|120|5|5|30|180"
    spec:
      containers:
        - name: worker
          image: 912894834396.dkr.ecr.ap-northeast-2.amazonaws.com/moduly-workflow-engine:dev-latest
          env:
            # DB 설정 (default namespace의 PostgreSQL 공유)
            - name: DB_HOST
              value: moduly-postgresql.chimouss4wpm.ap-northeast-2.rds.amazonaws.com
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: moduly_dev # dev 전용 database
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
            # Durable schedule dispatch (must match the Gateway mode/settings)
            - name: SCHEDULE_DISPATCH_MODE
              value: "disabled"
            - name: SCHEDULE_DISPATCH_MODE_FINGERPRINT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['nodease.io/schedule-dispatch-fingerprint']
            - name: SCHEDULE_DISPATCH_POLL_SECONDS
              value: "5"
            - name: SCHEDULE_OCCURRENCE_BATCH_SIZE
              value: "50"
            - name: SCHEDULE_DISPATCH_BATCH_SIZE
              value: "10"
            - name: SCHEDULE_RECOVERY_BATCH_SIZE
              value: "50"
            - name: SCHEDULE_CLEANUP_BATCH_SIZE
              value: "100"
            - name: SCHEDULE_DISPATCH_LEASE_SECONDS
              value: "60"
            - name: SCHEDULE_ENQUEUED_DELIVERY_TIMEOUT_SECONDS
              value: "120"
            - name: SCHEDULE_EXECUTION_DEADLINE_SECONDS
              value: "900"
            - name: SCHEDULE_WORKFLOW_RUN_VISIBILITY_TIMEOUT_SECONDS
              value: "120"
            - name: SCHEDULE_DISPATCH_MAX_ATTEMPTS
              value: "5"
            - name: SCHEDULE_DISPATCH_RETRY_BASE_SECONDS
              value: "5"
            - name: SCHEDULE_DISPATCH_RETENTION_DAYS
              value: "30"
            - name: SCHEDULE_DISPATCH_DEAD_LETTER_RETENTION_DAYS
              value: "180"
            # Dev 전용 Redis DB
            - name: REDIS_HOST
              value: redis-master.default.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_BROKER_DB
              value: "3"
            - name: REDIS_BACKEND_DB
              value: "4"
            - name: REDIS_DB
              value: "5"
            # S3 설정 (파일 처리용)
            - name: STORAGE_TYPE
              value: "CLOUD"
            - name: S3_BUCKET_NAME
              value: "moduly-dev-file-upload"
            - name: AWS_REGION
              value: "ap-northeast-2"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ENCRYPTION_KEY
            - name: MAIL_CREDENTIAL_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MAIL_CREDENTIAL_ENCRYPTION_KEYS
                  optional: true
            - name: MAIL_CREDENTIAL_ACTIVE_KEY_VERSION
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MAIL_CREDENTIAL_ACTIVE_KEY_VERSION
                  optional: true
            - name: WORKFLOW_NODE_SECRET_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: WORKFLOW_NODE_SECRET_ENCRYPTION_KEYS
                  optional: true
            - name: WORKFLOW_NODE_SECRET_ACTIVE_KEY_VERSION
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: WORKFLOW_NODE_SECRET_ACTIVE_KEY_VERSION
                  optional: true
            - name: LLM_CREDENTIAL_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: LLM_CREDENTIAL_ENCRYPTION_KEYS
                  optional: true
            - name: LLM_CREDENTIAL_ACTIVE_KEY_VERSION
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: LLM_CREDENTIAL_ACTIVE_KEY_VERSION
                  optional: true
            # Sandbox 설정
            - name: SANDBOX_URL
              value: "http://sandbox-service.dev.svc.cluster.local:8194"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-egress
  namespace: dev
spec:
  podSelector:
    matchLabels:
      app: worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The shared RDS and Redis dependencies are limited to service ports in
    # the Terraform-owned VPC. Private HTTP egress remains denied.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: sandbox
      ports:
        - protocol: TCP
          port: 8194
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.88.99.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 143
        - protocol: TCP
          port: 993
    - to:
        - ipBlock:
            cidr: ::/0
            except:
              - ::/96
              - ::/128
              - ::1/128
              - ::ffff:0:0/96
              - 64:ff9b::/96
              - 64:ff9b:1::/48
              - 100::/64
              - 2001::/23
              - 2001:db8::/32
              - 2002::/16
              - 3ffe::/16
              - 3fff::/20
              - 5f00::/16
              - fc00::/7
              - fe80::/10
              - fec0::/10
              - ff00::/8
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 143
        - protocol: TCP
          port: 993
