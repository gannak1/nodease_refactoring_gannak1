# Worker Deployment
#
# 역할: 백그라운드 작업 처리 (현재는 Placeholder)
#
# API Server와의 주요 차이점:
# 1. 실행 명령어: API는 uvicorn, Worker는 python/celery
# 2. 포트: API는 8000 포트 EXPOSE, Worker는 포트 없음
# 3. Service: API는 Service 있음, Worker는 Service 없음 (외부 접근 불필요)
# 4. Health Check: API는 HTTP health check, Worker는 없음
# 5. 리소스: Worker가 더 적은 CPU/메모리 (100m/128Mi vs 200m/256Mi)
# 6. Replicas: Worker는 1개, API는 2개
#
# 나중에 수정할 부분:
# - 21-23번 줄: Celery 구현 시 command와 args 수정
#   예시)
#   command: ["celery"]
#   args: ["-A", "apps.server.worker", "worker", "--loglevel=info"]
#
# - 필요시 Health Check 추가 (Celery inspect 사용)
# - 작업량에 따라 replicas 증가
# - 리소스 조정 (resources.requests/limits)
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 4
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        nodease.io/schedule-dispatch-fingerprint: "v1|disabled|5|50|10|50|100|60|120|900|120|5|5|30|180"
    spec:
      containers:
        - name: worker
          image: 912894834396.dkr.ecr.ap-northeast-2.amazonaws.com/moduly-workflow-engine:latest
          imagePullPolicy: Always # latest 태그 사용 시 항상 최신 이미지 pull
          env:
            - name: DB_HOST
              value: moduly-postgresql.chimouss4wpm.ap-northeast-2.rds.amazonaws.com
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: moduly
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: REDIS_HOST
              value: redis-master.default.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            # [FIX] 브로커/백엔드 Redis DB 분리 (I/O 경합 방지)
            - name: REDIS_BROKER_DB
              value: "0"
            - name: REDIS_BACKEND_DB
              value: "1"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
            # Durable schedule dispatch (must match the Gateway mode/settings)
            - name: SCHEDULE_DISPATCH_MODE
              value: "disabled"
            - name: SCHEDULE_DISPATCH_MODE_FINGERPRINT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['nodease.io/schedule-dispatch-fingerprint']
            - name: SCHEDULE_DISPATCH_POLL_SECONDS
              value: "5"
            - name: SCHEDULE_OCCURRENCE_BATCH_SIZE
              value: "50"
            - name: SCHEDULE_DISPATCH_BATCH_SIZE
              value: "10"
            - name: SCHEDULE_RECOVERY_BATCH_SIZE
              value: "50"
            - name: SCHEDULE_CLEANUP_BATCH_SIZE
              value: "100"
            - name: SCHEDULE_DISPATCH_LEASE_SECONDS
              value: "60"
            - name: SCHEDULE_ENQUEUED_DELIVERY_TIMEOUT_SECONDS
              value: "120"
            - name: SCHEDULE_EXECUTION_DEADLINE_SECONDS
              value: "900"
            - name: SCHEDULE_WORKFLOW_RUN_VISIBILITY_TIMEOUT_SECONDS
              value: "120"
            - name: SCHEDULE_DISPATCH_MAX_ATTEMPTS
              value: "5"
            - name: SCHEDULE_DISPATCH_RETRY_BASE_SECONDS
              value: "5"
            - name: SCHEDULE_DISPATCH_RETENTION_DAYS
              value: "30"
            - name: SCHEDULE_DISPATCH_DEAD_LETTER_RETENTION_DAYS
              value: "180"
            # Sandbox 설정 (Code 노드 실행용)
            - name: SANDBOX_URL
              value: "http://sandbox-service.default.svc.cluster.local:8194"
            # S3 설정 (파일 처리용)
            - name: STORAGE_TYPE
              value: "CLOUD"
            - name: S3_BUCKET_NAME
              value: "moduly-dev-file-upload"
            - name: AWS_REGION
              value: "ap-northeast-2"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ENCRYPTION_KEY
            - name: MAIL_CREDENTIAL_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MAIL_CREDENTIAL_ENCRYPTION_KEYS
                  optional: true
            - name: MAIL_CREDENTIAL_ACTIVE_KEY_VERSION
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MAIL_CREDENTIAL_ACTIVE_KEY_VERSION
                  optional: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi 
            limits:
              cpu: 500m 
              memory: 2Gi 
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-egress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # RDS and Redis are restricted to their service ports inside the
    # Terraform-owned VPC. This rule does not open private HTTP egress.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: sandbox
      ports:
        - protocol: TCP
          port: 8194
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.88.99.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 143
        - protocol: TCP
          port: 993
    - to:
        - ipBlock:
            cidr: ::/0
            except:
              - ::/96
              - ::/128
              - ::1/128
              - ::ffff:0:0/96
              - 64:ff9b::/96
              - 64:ff9b:1::/48
              - 100::/64
              - 2001::/23
              - 2001:db8::/32
              - 2002::/16
              - 3ffe::/16
              - 3fff::/20
              - 5f00::/16
              - fc00::/7
              - fe80::/10
              - fec0::/10
              - ff00::/8
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 143
        - protocol: TCP
          port: 993
